# Generates the contribution "snake" animation shown at the bottom of the profile README.
# Output is pushed to the `output` branch; the README reads it from there.
name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#42E6D4&color_dots=#161B22,#0E4E48,#1F8A80,#2FBFB0,#42E6D4
            dist/snake-light.svg?color_snake=#1F8A80&color_dots=#EBEDF0,#B8F2EA,#6FDCCF,#2FBFB0,#1F8A80

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
